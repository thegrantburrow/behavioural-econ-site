name = "oscar-finch-reference"
main = "index.js"
compatibility_date = "2026-09-01"

# The Worker runs in front of every request, including the static ones, so it
# can refuse to serve the site at all when the gate is not configured.
[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true

# Tags, ratings, notes and the taxonomy. Create with:
#   npx wrangler kv namespace create TAGS
# then paste the id it prints here.
# [[kv_namespaces]]
# binding = "TAGS"
# id = "PASTE_THE_ID_HERE"

[vars]
# Comma separated. Nobody gets in until this is set, including you.
ACCESS_EMAILS = ""
# Drive folder id, or several separated by commas.
DRIVE_FOLDER_ID = ""
# GOOGLE_SA_EMAIL is a var, GOOGLE_SA_KEY is a secret. Set the key with:
#   npx wrangler secret put GOOGLE_SA_KEY
GOOGLE_SA_EMAIL = ""
