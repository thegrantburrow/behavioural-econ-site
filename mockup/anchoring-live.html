<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Live Anchoring | What Works &amp; Why</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  --paper:#F5F6F5; --panel:#FFFFFF; --line:rgba(27,30,36,0.12);
  --ink:#1B1E24; --ink-soft:rgba(27,30,36,0.62);
  --terracotta:#C43E1F; --mustard:#E0A93A; --teal:#1F7A6C;
  --shadow: 0 1px 2px rgba(27,30,36,.06), 0 8px 24px rgba(27,30,36,.08);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh;}
#app{display:flex;flex-direction:column;flex:1;min-height:0;}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px 40px;max-width:440px;margin:0 auto;width:100%;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--terracotta);font-weight:700;text-align:center;margin-bottom:10px;}
h1.q{font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.35;text-align:center;margin:0 0 26px;text-wrap:balance;}
h1.q b{color:var(--terracotta);}
.btnrow{display:flex;gap:10px;}
.bigbtn{flex:1;text-align:center;font-size:15px;font-weight:700;padding:16px 8px;border-radius:12px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;font-family:inherit;}
.bigbtn:active{transform:scale(.98);}
.bigbtn.filled{background:var(--ink);color:var(--paper);}
.numwrap{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:22px;}
.numinput{width:150px;font-size:32px;font-weight:700;text-align:center;padding:10px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;}
.numinput:focus{outline:2px solid var(--terracotta);outline-offset:1px;}
.suffix{font-size:26px;font-weight:700;color:var(--ink-soft);}
.submitbtn{margin-top:4px;background:var(--terracotta);color:#fff;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.submitbtn:disabled{opacity:.5;cursor:default;}
.msg{text-align:center;font-size:14px;line-height:1.6;color:var(--ink-soft);}
.msg b{display:block;color:var(--ink);font-size:19px;font-family:Georgia,serif;margin-bottom:10px;}
.msg .ps{margin-top:14px;font-size:12.5px;}

/* presenter tally / reveal view, designed to also work projected large in a room */
.reveal-wrap{max-width:1080px;margin:0 auto;padding:36px 22px 48px;width:100%;}
.reveal-title{font-family:Georgia,serif;font-weight:700;font-size:clamp(26px,4vw,46px);text-align:center;margin:0 0 6px;text-wrap:balance;}
.reveal-sub{text-align:center;font-size:clamp(13px,1.3vw,16px);color:var(--ink-soft);margin:0 0 32px;max-width:64ch;margin-left:auto;margin-right:auto;line-height:1.6;}

/* the big head-to-head scoreboard, the room-scale focal point */
.scoreboard{margin:0 0 20px;}
.scoreboard-answer{text-align:center;margin:0 0 26px;}
.scoreboard-answer .tag{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);font-weight:700;font-size:clamp(13px,1.5vw,17px);padding:12px 26px;border-radius:999px;box-shadow:var(--shadow);}
.scoreboard-answer .tag svg{width:20px;height:20px;flex-shrink:0;}
.scoreboard-answer .tag b{font-size:1.2em;color:var(--mustard);}
.scoreboard-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px;}
@media (max-width:760px){ .scoreboard-grid{grid-template-columns:1fr;gap:16px;} .scoreboard-vs{order:2;margin:-4px auto;} }
.scoreboard-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,2.6vw,34px) clamp(16px,2.2vw,30px);text-align:center;box-shadow:var(--shadow);}
.scoreboard-card .sc-label{font-size:clamp(12px,1.3vw,15px);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 4px;}
.scoreboard-card .sc-anchor{font-size:clamp(11px,1.1vw,13px);color:var(--ink-soft);margin:0 0 16px;}
.scoreboard-number{font-family:Georgia,serif;font-weight:700;font-size:clamp(52px,8.5vw,104px);line-height:1;margin:0 0 4px;}
.scoreboard-number.empty{color:var(--ink-soft);font-size:clamp(30px,5vw,52px);}
.scoreboard-number.pop{animation:scPop .55s cubic-bezier(.22,.9,.3,1.25);}
@keyframes scPop{0%{transform:scale(.7);opacity:0;}65%{transform:scale(1.07);opacity:1;}100%{transform:scale(1);}}
.scoreboard-n{font-size:clamp(12px,1.2vw,14px);color:var(--ink-soft);margin:0 0 18px;}
.scoreboard-bar-track{position:relative;height:22px;border-radius:11px;background:var(--line);}
.scoreboard-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:11px;width:0;transition:width .9s cubic-bezier(.16,.85,.32,1);}
.scoreboard-truth-mark{position:absolute;top:-9px;bottom:-9px;width:0;border-left:3px dashed var(--ink);}
.scoreboard-truth-caption{text-align:center;font-size:10.5px;color:var(--ink-soft);margin-top:8px;}
.scoreboard-truth-caption .sw{display:inline-block;width:11px;border-top:2.5px dashed var(--ink);margin-right:5px;vertical-align:middle;}
.scoreboard-vs{width:60px;height:60px;border-radius:50%;background:var(--terracotta);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:16px;margin:0 auto;box-shadow:var(--shadow);flex-shrink:0;}
@media (max-width:760px){ .scoreboard-vs{width:42px;height:42px;font-size:12px;} }
.scoreboard-gap{text-align:center;margin-top:22px;font-size:clamp(14px,1.6vw,19px);color:var(--ink-soft);}
.scoreboard-gap b{color:var(--terracotta);font-family:Georgia,serif;}

/* compact presenter-only controls, deliberately quieter than the scoreboard above */
.presenter-controls{margin:0 0 30px;background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:18px 18px 14px;}
.presenter-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;text-align:center;margin:0 0 4px;}
.presenter-note{font-size:11.5px;color:var(--ink-soft);text-align:center;margin:0 0 14px;}
.tally-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:600px){ .tally-cols{grid-template-columns:1fr;} }
.tally-col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.tally-col h3{font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;color:var(--ink-soft);}
.tally-input-row{display:flex;gap:6px;margin-bottom:10px;}
.tally-input-row input{flex:1;min-width:0;font-size:16px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);font-family:inherit;}
.tally-input-row button{background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:0 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.tally-chips{display:flex;flex-wrap:wrap;gap:6px;}
.tally-chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;display:flex;align-items:center;gap:6px;}
.tally-chip button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0;line-height:1;}

/* the room's live result vs. the original 1974 study, same visual language, smaller scale */
/* This is the session's second hero moment, not a footnote: the room's own
   number set directly against the classic study's, at a scale that reads
   from the back of the room, same as the scoreboard above it. */
.historical{border-top:1px solid var(--line);padding-top:clamp(28px,3.5vw,44px);margin-top:8px;}
.historical-heading{text-align:center;font-size:clamp(15px,1.8vw,22px);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:800;margin:0 0 clamp(18px,2.2vw,28px);}
.historical-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2vw,28px);max-width:1000px;margin:0 auto;}
@media (max-width:640px){ .historical-grid{grid-template-columns:1fr;gap:16px;} }
.historical-col{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2.4vw,30px);box-shadow:var(--shadow);}
.historical-col .hc-label{font-size:clamp(13px,1.5vw,18px);font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);text-align:center;margin:0 0 clamp(14px,1.8vw,20px);}
.historical-row{display:flex;align-items:center;gap:clamp(10px,1.4vw,16px);margin-bottom:clamp(10px,1.4vw,16px);}
.historical-row:last-child{margin-bottom:0;}
.historical-row .hr-tag{min-width:52px;flex-shrink:0;font-size:clamp(13px,1.5vw,18px);font-weight:800;text-align:right;color:var(--ink);}
.historical-bar-track{flex:1;height:clamp(26px,3.4vw,44px);border-radius:14px;background:var(--line);position:relative;}
.historical-bar-fill{height:100%;border-radius:14px;display:flex;align-items:center;justify-content:flex-end;padding-right:clamp(8px,1vw,14px);min-width:2px;transition:width .6s ease;}
.historical-bar-fill span{font-size:clamp(14px,1.7vw,21px);font-weight:800;color:#fff;white-space:nowrap;}
body.presenting .historical-grid{max-width:1300px;}
body.presenting .historical-heading{font-size:clamp(20px,2.6vw,32px);}
body.presenting .historical-col .hc-label{font-size:clamp(15px,1.8vw,22px);}
body.presenting .historical-row .hr-tag{font-size:clamp(16px,2vw,24px);}
body.presenting .historical-bar-track{height:clamp(34px,4.4vw,58px);}
body.presenting .historical-bar-fill span{font-size:clamp(18px,2.2vw,28px);}

.narrative-section{border-top:1px solid var(--line);margin-top:8px;padding-top:26px;}
.narrative-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--terracotta);font-weight:700;text-align:center;margin-bottom:14px;}
.narrative-verdict{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ink-soft);border-radius:10px;padding:16px 18px;margin-bottom:22px;}
.narrative-verdict.aligned{border-left-color:var(--teal);}
.narrative-verdict.reversed{border-left-color:var(--terracotta);}
.narrative-verdict.tie{border-left-color:var(--mustard);}
.narrative-verdict.wait{border-left-color:var(--mustard);}
.narrative-tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.narrative-tag.aligned{color:var(--teal);}
.narrative-tag.reversed{color:var(--terracotta);}
.narrative-tag.tie{color:#a3821f;}
.narrative-tag.wait{color:#a3821f;}
.narrative-verdict p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink);}
.narrative-verdict p+p{margin-top:10px;}
.narrative-verdict p a{color:inherit;}
.narrative-block{margin-bottom:22px;}
.narrative-block h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;color:var(--ink);}
.narrative-block > p{font-size:13.5px;line-height:1.65;color:var(--ink-soft);margin:0;}
.narrative-block p a{color:var(--terracotta);}
.example-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;}
.example-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.example-label{font-size:13.5px;font-weight:700;margin-bottom:5px;}
.example-item p{font-size:13px;line-height:1.6;color:var(--ink-soft);margin:0 0 6px;}
.example-cite{font-size:11px;color:var(--ink-soft);opacity:.75;}

.session-row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 28px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.session-info{font-size:12px;color:var(--ink-soft);}
.session-info b{color:var(--ink);}
.session-btn{font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);}
.session-btn.danger{border-color:var(--terracotta);background:none;color:var(--terracotta);}
.mode-switch{display:flex;gap:2px;background:var(--line);border-radius:999px;padding:3px;width:fit-content;margin:0 auto 18px;}
.mode-switch button{border:none;background:transparent;border-radius:999px;padding:8px 20px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
.mode-switch button.active{background:var(--ink);color:var(--paper);}
/* the switch only makes sense on a screen big enough to actually be a room display; a phone is always the participant's own device, never the projector */
@media (max-width:760px){ .mode-switch{display:none;} }

/* Room presentation view: strip presenter-only chrome, let the room-scale
   scoreboard and verdict fill the screen. Mobile never sees this mode at
   all (the toggle is hidden above), so this block only ever applies on a
   desktop/laptop screen already being cast to a projector or a big display. */
body.presenting .reveal-sub,
body.presenting .manage-only,
body.presenting .presenter-controls,
body.presenting .narrative-block,
body.presenting .history-section,
body.presenting .reset-row{display:none;}
body.presenting .reveal-wrap{max-width:1600px;}
body.presenting .reveal-title{font-size:clamp(32px,5.5vw,68px);}
body.presenting .scoreboard-number{font-size:clamp(64px,11vw,180px);}
body.presenting .scoreboard-gap{font-size:clamp(18px,2.4vw,30px);}
body.presenting .narrative-verdict{padding:clamp(20px,2.4vw,34px);}
body.presenting .narrative-verdict p{font-size:clamp(15px,1.8vw,22px);}
body.presenting .narrative-tag{font-size:clamp(12px,1.4vw,16px);}

.qr-section{margin:0 0 30px;}
.qr-heading{text-align:center;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 14px;}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:16px;}
.qr-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;}
.qr-card img{width:100%;max-width:260px;height:auto;margin:0 auto 12px;display:block;border-radius:8px;}
.qr-card .qr-label{font-size:clamp(13px,1.3vw,15px);font-weight:700;margin-bottom:4px;}
.qr-card .qr-link{font-size:10.5px;color:var(--ink-soft);word-break:break-all;}
.qr-explainer{text-align:center;font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 16px;max-width:52ch;margin-left:auto;margin-right:auto;}
.qr-card .qr-link{display:block;font-size:10.5px;color:var(--terracotta);word-break:break-all;text-decoration:underline;margin-bottom:8px;}
.qr-copy-btn{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-family:inherit;}
.qr-copy-btn[data-copied="true"]{background:var(--terracotta);color:#fff;border-color:var(--terracotta);}
.qr-note{text-align:center;font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;}

.reset-row{text-align:center;}
.reset-btn{font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit;}

.history-section{border-top:1px solid var(--line);margin-top:30px;padding-top:20px;}
.history-heading{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 12px;text-align:center;}
.history-empty{text-align:center;font-size:12.5px;color:var(--ink-soft);}
.history-session{margin-bottom:16px;}
.history-session-head{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.history-session-head .n{font-weight:400;color:var(--ink-soft);}
.history-table{width:100%;border-collapse:collapse;font-size:12px;}
.history-table th{text-align:left;color:var(--ink-soft);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line);}
.history-table td{padding:4px 8px;border-bottom:1px solid var(--line);}
.history-table .g-a{color:var(--terracotta);font-weight:700;}
.history-table .g-b{color:var(--teal);font-weight:700;}
.history-table td.rm{text-align:right;}
.history-table td.rm button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

var currentSyncModeSwitch = function(){};

var FACT = {
  comparative: function(anchor){
    return 'Is the percentage of United Nations member countries that are in Africa more or less than <b>' + anchor + '%</b>?';
  },
  estimateQuestion: 'What percentage of United Nations member countries are in Africa?',
  truth: 28,
  suffix: '%',
  min: 0,
  max: 100,
  historicalHigh: 45,
  historicalLow: 25
};

var GROUPS = {
  a: { anchor: 65, label: 'High anchor (asked about 65%)' },
  b: { anchor: 10, label: 'Low anchor (asked about 10%)' }
};

function getGroupFromHash(){
  var h = location.hash.replace('#','');
  var m = h.match(/(?:^|&)g=([ab])(?:&|$)/);
  return m ? m[1] : null;
}
function isReveal(){
  return /(^|#|&)reveal(&|$)/.test(location.hash);
}

function el(tag, attrs, html){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function render(node){
  var app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(node);
}

function renderNoGroup(){
  var s = el('div', {class:'screen'}, '');
  s.appendChild(el('div', {class:'eyebrow'}, 'Live Anchoring'));
  s.appendChild(el('div', {class:'msg'},
    '<b>This link needs to come from one of the session QR codes.</b>Ask whoever&rsquo;s running the session for the right link.'));
  render(s);
}

function renderComparative(group){
  var anchor = GROUPS[group].anchor;
  var s = el('div', {class:'screen'}, '');
  s.appendChild(el('div', {class:'eyebrow'}, 'Quick question'));
  s.appendChild(el('h1', {class:'q'}, FACT.comparative(anchor)));
  var row = el('div', {class:'btnrow'}, '');
  var more = el('button', {class:'bigbtn filled', type:'button'}, 'More');
  var less = el('button', {class:'bigbtn', type:'button'}, 'Less');
  function advance(){ renderEstimate(group); }
  more.addEventListener('click', advance);
  less.addEventListener('click', advance);
  row.appendChild(more); row.appendChild(less);
  s.appendChild(row);
  render(s);
}

function renderEstimate(group){
  var s = el('div', {class:'screen'}, '');
  s.appendChild(el('div', {class:'eyebrow'}, 'Your estimate'));
  s.appendChild(el('h1', {class:'q'}, FACT.estimateQuestion));
  var wrap = el('div', {class:'numwrap'}, '');
  var input = el('input', {class:'numinput', type:'number', inputmode:'numeric', min:String(FACT.min), max:String(FACT.max), placeholder:'?'});
  wrap.appendChild(input);
  wrap.appendChild(el('span', {class:'suffix'}, FACT.suffix));
  s.appendChild(wrap);
  var btn = el('button', {class:'submitbtn', type:'button'}, 'Submit');
  btn.disabled = true;
  input.addEventListener('input', function(){
    var v = parseFloat(input.value);
    btn.disabled = !(isFinite(v) && v >= FACT.min && v <= FACT.max);
  });
  btn.addEventListener('click', function(){
    var v = parseFloat(input.value);
    if (!isFinite(v)) return;
    renderThanks(v, group);
  });
  s.appendChild(btn);
  render(s);
  input.focus();
}

function renderThanks(v, g){
  addEntry(g, v);
  var s = el('div', {class:'screen'}, '');
  s.appendChild(el('div', {class:'msg'},
    '<b>Thanks, your answer is ' + v + FACT.suffix + '.</b>' +
    'If the presenter is running this on the same screen as you, it&rsquo;s already logged. Otherwise, call out your number (or put your hand up when asked) so it can be added to the results.' +
    '<div class="ps">Phones don&rsquo;t automatically share answers with each other, only with this same browser, that&rsquo;s why the room comparison usually happens out loud.</div>'));
  render(s);
}

/* ---------------- shared, persistent log (localStorage) ----------------
   la_log: append-only array of every entry ever recorded, {id,g,v,t,sessionId}.
   la_session: the currently active session {id,startedAt}. "Start new
   session" only moves this pointer forward, it never deletes la_log, so
   the live tally (scoped to the current session) and the full history
   (every session ever) are two different views of the same data. */

var LS_LOG = 'la_log';
var LS_SESSION = 'la_session';

function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'r' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function readLog(){
  try {
    var raw = localStorage.getItem(LS_LOG);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
}
function writeLog(arr){
  try { localStorage.setItem(LS_LOG, JSON.stringify(arr)); } catch(e){}
}

function getSession(){
  try {
    var raw = localStorage.getItem(LS_SESSION);
    var s = raw ? JSON.parse(raw) : null;
    if (s && s.id && s.startedAt) return s;
  } catch(e){}
  var fresh = { id: uid(), startedAt: Date.now() };
  try { localStorage.setItem(LS_SESSION, JSON.stringify(fresh)); } catch(e){}
  return fresh;
}

function startNewSession(){
  var fresh = { id: uid(), startedAt: Date.now() };
  try { localStorage.setItem(LS_SESSION, JSON.stringify(fresh)); } catch(e){}
  return fresh;
}

function addEntry(g, v){
  var session = getSession();
  var log = readLog();
  log.push({ id: uid(), g: g, v: v, t: Date.now(), sessionId: session.id });
  writeLog(log);
}

function removeEntry(id){
  writeLog(readLog().filter(function(e){ return e.id !== id; }));
}

function median(nums){
  if (!nums.length) return null;
  var s = nums.slice().sort(function(a,b){ return a-b; });
  var mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
}

function formatDateTime(t){
  var d = new Date(t);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'}) + ', ' +
    d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
}

var EXAMPLES = [
  {
    label: 'Credit card minimum payments',
    body: 'A statement that shows &ldquo;minimum payment: $35&rdquo; anchors what feels like a reasonable amount to repay, even for people who could easily pay more. One study found that simply printing a minimum payment figure measurably lowered how much people chose to repay, real money left on the table because of one printed number.',
    cite: 'Stewart, N. (2009). &ldquo;The Cost of Anchoring on Credit-Card Minimum Repayments.&rdquo; <a href="https://journals.sagepub.com/doi/abs/10.1111/j.1467-9280.2008.02255.x" target="_blank" rel="noopener">Psychological Science, 20(1), 39&ndash;41</a>'
  },
  {

    cite: 'Northcraft, G. B., &amp; Neale, M. A. (1987). &ldquo;Experts, Amateurs, and Real Estate.&rdquo; <a href="https://www.sciencedirect.com/science/article/abs/pii/074959788790046X" target="_blank" rel="noopener">Organizational Behavior and Human Decision Processes, 39(1), 84&ndash;97</a>'
  },
  {

    cite: 'Galinsky, A. D., &amp; Mussweiler, T. (2001). &ldquo;First Offers as Anchors.&rdquo; <a href="https://pubmed.ncbi.nlm.nih.gov/11642352/" target="_blank" rel="noopener">Journal of Personality and Social Psychology, 81(4), 657&ndash;669</a>'
  },
  {

  },

function renderNarrative(byGroup){
  var section = el('div', {class:'narrative-section'}, '');
  section.appendChild(el('div', {class:'narrative-eyebrow'}, 'What this session shows'));

  var valsA = byGroup.a.map(function(e){ return e.v; });
  var valsB = byGroup.b.map(function(e){ return e.v; });
  var nA = valsA.length, nB = valsB.length;
  var medA = median(valsA), medB = median(valsB);

  var tag, tagClass, verdictHtml;

  if (nA === 0 && nB === 0) {
    tag = 'Waiting for answers'; tagClass = 'wait';
    verdictHtml = 'Nobody in either group has answered yet. Once at least one answer lands on each side, this box explains whether your room&rsquo;s results lined up with the classic anchoring pattern, a higher median guess from the group asked about 65% than from the group asked about 10%, or not.';
  } else if (nA === 0 || nB === 0) {
    var emptyLabel = (nA === 0 ? GROUPS.a.label : GROUPS.b.label).split(' (')[0];
    tag = 'Waiting for answers'; tagClass = 'wait';
    verdictHtml = 'The &ldquo;' + emptyLabel + '&rdquo; group still has zero answers. Add at least one to each side to see whether this room&rsquo;s results lined up with the anchoring effect.';
  } else {
    var diff = medA - medB;
    var smallN = (nA < 5 || nB < 5);
    if (diff > 0) {
      tag = 'Lined up with anchoring'; tagClass = 'aligned';
      verdictHtml = 'The high-anchor group&rsquo;s median guess, <b>' + Math.round(medA) + FACT.suffix + '</b> (n=' + nA + '), came in higher than the low-anchor group&rsquo;s, <b>' + Math.round(medB) + FACT.suffix + '</b> (n=' + nB + '). <b>That&rsquo;s the same direction Tversky and Kahneman found with their rigged wheel in 1974</b>: whichever number people heard first, even one they knew was random, pulled their guess toward it.';
      if (smallN) verdictHtml += ' With well under a dozen answers on the smaller side, <b>treat this as a live demonstration rather than a controlled study</b>. The direction is still the one decades of replication would predict.';
    } else if (diff === 0) {
      tag = 'Too close to call'; tagClass = 'tie';
      verdictHtml = 'Both groups landed on the exact same median guess, <b>' + Math.round(medA) + FACT.suffix + '</b> (n=' + nA + ' and n=' + nB + '). At this sample size that&rsquo;s a coin flip away from tipping either direction. <b>It isn&rsquo;t evidence the effect is missing, just too little data yet to see it clearly.</b> Add more answers and check back.';
    } else {
      tag = 'Didn&rsquo;t line up this time'; tagClass = 'reversed';
      verdictHtml = 'This time it ran the other way: the low-anchor group&rsquo;s median guess, <b>' + Math.round(medB) + FACT.suffix + '</b> (n=' + nB + '), came in higher than the high-anchor group&rsquo;s, <b>' + Math.round(medA) + FACT.suffix + '</b> (n=' + nA + '). <b>Tversky and Kahneman&rsquo;s own version, and dozens of replications since, are among the most reliable findings in behavioural science</b>, so one reversed session doesn&rsquo;t undo that.</p><p>What it usually means at this size is noise: <b>a handful of people per side is a small enough sample that one or two unusual guesses can flip the median entirely</b>, even when the underlying effect is real. That&rsquo;s a genuine lesson in its own right, the same reason a single small study, or a single small session like this one, should never settle a question the way a large replication does. <a href="small-sample-big-claim.html">This site&rsquo;s own report on small samples</a> covers what that looks like when it happens in a published paper instead of a room.';
    }
  }

  var verdict = el('div', {class:'narrative-verdict ' + tagClass}, '');
  verdict.appendChild(el('span', {class:'narrative-tag ' + tagClass}, tag));
  verdict.appendChild(el('p', {}, verdictHtml));
  section.appendChild(verdict);

  section.appendChild(el('div', {class:'narrative-block'},
    '<h4>The mechanism, in one paragraph</h4><p>This is the &ldquo;anchoring-and-adjustment&rdquo; heuristic. Instead of estimating from scratch, people start from whatever number they heard most recently, even an arbitrary one like a rigged wheel or this page&rsquo;s own comparative question, and adjust away from it. <b>That adjustment reliably stops too early, as soon as the number feels plausible, not when it&rsquo;s actually correct.</b> The result: <b>two groups shown the identical real question end up with different guesses</b>, each pulled toward whichever starting number it happened to hear. <a href="principles.html#anchoring">Read the full write-up, including the original study, on the Principles page.</a></p>'));

  var examplesBlock = el('div', {class:'narrative-block'}, '<h4>Where this shows up outside the room</h4>');
  var list = el('ul', {class:'example-list'}, '');
  EXAMPLES.forEach(function(ex){
    var li = el('li', {class:'example-item'}, '');
    li.appendChild(el('div', {class:'example-label'}, ex.label));
    li.appendChild(el('p', {}, ex.body));
    li.appendChild(el('div', {class:'example-cite'}, ex.cite));
    list.appendChild(li);
  });
  examplesBlock.appendChild(list);
  section.appendChild(examplesBlock);

  return section;
}

/* ---------------- presenter session / tally / history screen ---------------- */

var TARGET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"></circle></svg>';

function copyQrLink(text, btn){
  function done(){
    btn.textContent = 'Copied ✓';
    btn.setAttribute('data-copied', 'true');
    setTimeout(function(){ btn.textContent = 'Copy link'; btn.removeAttribute('data-copied'); }, 1800);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopyQr(text, done); });
  } else {
    fallbackCopyQr(text, done);
  }
}
function fallbackCopyQr(text, cb){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  cb();
}

function renderReveal(){
  var session = getSession();
  var log = readLog();
  var currentEntries = log.filter(function(e){ return e.sessionId === session.id; });
  var byGroup = { a: [], b: [] };
  currentEntries.forEach(function(e){ if (byGroup[e.g]) byGroup[e.g].push(e); });

  var wrap = el('div', {class:'reveal-wrap'}, '');

  var modeSwitch = el('div', {class:'mode-switch'}, '');
  var stdBtn = el('button', {type:'button'}, 'Standard');
  var presBtn = el('button', {type:'button'}, 'Presentation');
  function syncModeSwitch(){
    var presenting = document.body.classList.contains('presenting');
    stdBtn.classList.toggle('active', !presenting);
    presBtn.classList.toggle('active', presenting);
  }
  syncModeSwitch();
  currentSyncModeSwitch = syncModeSwitch;
  stdBtn.addEventListener('click', function(){
    if (!document.body.classList.contains('presenting')) return;
    document.body.classList.remove('presenting');
    syncModeSwitch();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
  });
  presBtn.addEventListener('click', function(){
    if (document.body.classList.contains('presenting')) return;
    document.body.classList.add('presenting');
    syncModeSwitch();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
  });
  modeSwitch.appendChild(stdBtn);
  modeSwitch.appendChild(presBtn);
  wrap.appendChild(modeSwitch);

  wrap.appendChild(el('h1', {class:'reveal-title'}, 'Live Anchoring: session'));
  wrap.appendChild(el('p', {class:'reveal-sub'}, 'Scan-and-answer entries from this same browser log automatically. For separate phones in the room, ask a show of hands, or a few people per side to call out their number, and type each one in as you hear it.'));

  var sessionRow = el('div', {class:'session-row'}, '');
  sessionRow.appendChild(el('div', {class:'session-info manage-only'}, 'Current session started <b>' + formatDateTime(session.startedAt) + '</b> &middot; ' + currentEntries.length + ' answer' + (currentEntries.length===1?'':'s')));
  var newSessionBtn = el('button', {class:'session-btn manage-only', type:'button'}, 'Start new session');
  newSessionBtn.addEventListener('click', function(){
    if (currentEntries.length && !confirm('Start a new session? Today’s ' + currentEntries.length + ' answer(s) move into history, the live tally resets to zero.')) return;
    startNewSession();
    renderReveal();
  });
  sessionRow.appendChild(newSessionBtn);
  wrap.appendChild(sessionRow);

  var qrSection = el('div', {class:'qr-section'}, '');
  qrSection.appendChild(el('div', {class:'qr-heading'}, 'Session QR codes'));
  qrSection.appendChild(el('div', {class:'qr-explainer'}, 'Split your room in two. Print or send each code below to one half, whichever one someone opens or scans decides which version they get, the page tells them what to do from there.'));
  var qrGrid = el('div', {class:'qr-grid'}, '');
  Object.keys(GROUPS).forEach(function(g){
    var card = el('div', {class:'qr-card'}, '');
    card.appendChild(el('img', {src:'images/qr-anchoring-' + g + '.png', alt:'QR code for ' + GROUPS[g].label, loading:'lazy'}));
    card.appendChild(el('div', {class:'qr-label'}, GROUPS[g].label));
    var linkUrl = location.origin + location.pathname + '#g=' + g;
    card.appendChild(el('a', {class:'qr-link', href:linkUrl, target:'_blank', rel:'noopener'}, linkUrl));
    var copyBtn = el('button', {class:'qr-copy-btn', type:'button'}, 'Copy link');
    copyBtn.addEventListener('click', function(){ copyQrLink(linkUrl, copyBtn); });
    card.appendChild(copyBtn);
    qrGrid.appendChild(card);
  });
  qrSection.appendChild(qrGrid);
  qrSection.appendChild(el('div', {class:'qr-note'}, 'These two codes are permanent, print them once and reuse them for every future session. &ldquo;Start new session&rdquo; resets the tally, not the codes.'));
  wrap.appendChild(qrSection);

  /* ---- the big head-to-head scoreboard: the room-scale focal point ---- */
  var colors = { a: 'var(--terracotta)', b: 'var(--teal)' };
  var medA = median(byGroup.a.map(function(e){ return e.v; }));
  var medB = median(byGroup.b.map(function(e){ return e.v; }));
  var nA = byGroup.a.length, nB = byGroup.b.length;
  var maxVal = Math.max(FACT.truth, 20, medA || 0, medB || 0);

  var scoreboard = el('div', {class:'scoreboard'}, '');
  scoreboard.appendChild(el('div', {class:'scoreboard-answer'},
    '<span class="tag">' + TARGET_ICON + 'The real answer: <b>' + FACT.truth + FACT.suffix + '</b></span>'));

  var grid = el('div', {class:'scoreboard-grid'}, '');
  ['a','b'].forEach(function(g){
    var med = g === 'a' ? medA : medB;
    var n = g === 'a' ? nA : nB;
    var card = el('div', {class:'scoreboard-card'}, '');
    card.appendChild(el('div', {class:'sc-label'}, GROUPS[g].label.split(' (')[0]));
    card.appendChild(el('div', {class:'sc-anchor'}, 'Asked about ' + GROUPS[g].anchor + FACT.suffix));
    card.appendChild(el('div', {class:'scoreboard-number' + (med === null ? ' empty' : ' pop')}, med === null ? 'No answers yet' : Math.round(med) + FACT.suffix));
    card.appendChild(el('div', {class:'scoreboard-n'}, n + ' answer' + (n===1?'':'s')));
    var track = el('div', {class:'scoreboard-bar-track'}, '');
    if (med !== null){
      var fill = el('div', {class:'scoreboard-bar-fill'}, '');
      fill.style.background = colors[g];
      track.appendChild(fill);
    }
    var truthPct = Math.max(0, Math.min(100, (FACT.truth / maxVal) * 100));
    var truth = el('div', {class:'scoreboard-truth-mark'}, '');
    truth.style.left = truthPct + '%';
    track.appendChild(truth);
    card.appendChild(track);
    card.appendChild(el('div', {class:'scoreboard-truth-caption'}, '<span class="sw"></span>Real answer'));
    grid.appendChild(card);
    if (g === 'a') grid.appendChild(el('div', {class:'scoreboard-vs'}, 'VS'));
    if (med !== null){
      requestAnimationFrame(function(){
        var pct = Math.max(4, Math.min(100, (med / maxVal) * 100));
        fill.style.width = pct + '%';
      });
    }
  });
  scoreboard.appendChild(grid);

  var gapEl = el('div', {class:'scoreboard-gap'}, '');
  if (medA !== null && medB !== null){
    var diff = Math.round(Math.abs(medA - medB));
    gapEl.innerHTML = diff === 0 ? 'Both groups landed on the exact same number, <b>too close to call yet</b>.'
      : '<b>' + diff + FACT.suffix + '</b> apart between the two groups, same real question, same room.';
  } else {
    gapEl.innerHTML = 'Waiting on answers from both groups to show the gap.';
  }
  scoreboard.appendChild(gapEl);
  wrap.appendChild(scoreboard);

  /* ---- presenter-only controls: quieter, for whoever is typing in called-out numbers ---- */
  var controls = el('div', {class:'presenter-controls'}, '');
  controls.appendChild(el('div', {class:'presenter-eyebrow'}, 'Presenter controls'));
  controls.appendChild(el('div', {class:'presenter-note'}, 'Type in a number as the room calls it out, or tap &times; to remove a mistaken entry. This box is for whoever is running the session, not for the projector.'));
  var cols = el('div', {class:'tally-cols'}, '');
  Object.keys(GROUPS).forEach(function(g){
    var col = el('div', {class:'tally-col'}, '');
    col.appendChild(el('h3', {}, GROUPS[g].label.split(' (')[0]));
    var inputRow = el('div', {class:'tally-input-row'}, '');
    var input = el('input', {type:'number', inputmode:'numeric', placeholder:'e.g. ' + (g==='a'?'50':'15')});
    var addBtn = el('button', {type:'button'}, 'Add');
    function add(){
      var v = parseFloat(input.value);
      if (!isFinite(v)) return;
      addEntry(g, v);
      input.value = '';
      renderReveal();
    }
    addBtn.addEventListener('click', add);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') add(); });
    inputRow.appendChild(input); inputRow.appendChild(addBtn);
    col.appendChild(inputRow);

    var chips = el('div', {class:'tally-chips'}, '');
    byGroup[g].forEach(function(e){
      var chip = el('span', {class:'tally-chip'}, e.v + FACT.suffix + ' ');
      var rm = el('button', {type:'button', 'aria-label':'Remove'}, '&times;');
      rm.addEventListener('click', function(){ removeEntry(e.id); renderReveal(); });
      chip.appendChild(rm);
      chips.appendChild(chip);
    });
    col.appendChild(chips);
    cols.appendChild(col);
  });
  controls.appendChild(cols);
  wrap.appendChild(controls);

  /* ---- this room vs. the original 1974 study, same visual language, smaller scale ---- */
  var histMax = Math.max(FACT.historicalHigh, FACT.historicalLow, medA || 0, medB || 0, FACT.truth);
  function histRow(label, val, color){
    var row = el('div', {class:'historical-row'}, '');
    row.appendChild(el('div', {class:'hr-tag'}, label));
    var track = el('div', {class:'historical-bar-track'}, '');
    if (val !== null){
      var pct = Math.max(4, Math.min(100, (val / histMax) * 100));
      var fill = el('div', {class:'historical-bar-fill'}, '<span>' + Math.round(val) + FACT.suffix + '</span>');
      fill.style.width = pct + '%';
      fill.style.background = color;
      track.appendChild(fill);
    }
    row.appendChild(track);
    return row;
  }
  var histSection = el('div', {class:'historical'}, '');
  histSection.appendChild(el('div', {class:'historical-heading'}, 'This room vs. the original 1974 study'));
  var histGrid = el('div', {class:'historical-grid'}, '');
  var thisRoomCol = el('div', {class:'historical-col'}, '<div class="hc-label">This room, right now</div>');
  thisRoomCol.appendChild(histRow('High', medA, colors.a));
  thisRoomCol.appendChild(histRow('Low', medB, colors.b));
  var originalCol = el('div', {class:'historical-col'}, '<div class="hc-label">Tversky &amp; Kahneman, 1974</div>');
  originalCol.appendChild(histRow('High', FACT.historicalHigh, colors.a));
  originalCol.appendChild(histRow('Low', FACT.historicalLow, colors.b));
  histGrid.appendChild(thisRoomCol);
  histGrid.appendChild(originalCol);
  histSection.appendChild(histGrid);
  wrap.appendChild(histSection);

  wrap.appendChild(renderNarrative(byGroup));

  /* ---- full history, every session ever recorded on this device ---- */
  var historySection = el('div', {class:'history-section'}, '');
  historySection.appendChild(el('div', {class:'history-heading'}, 'Session history (this device)'));
  if (!log.length) {
    historySection.appendChild(el('div', {class:'history-empty'}, 'No sessions recorded yet on this device.'));
  } else {
    var bySession = {};
    var order = [];
    log.forEach(function(e){
      if (!bySession[e.sessionId]) { bySession[e.sessionId] = []; order.push(e.sessionId); }
      bySession[e.sessionId].push(e);
    });
    order.slice().reverse().forEach(function(sid){
      var entries = bySession[sid].slice().sort(function(a,b){ return a.t - b.t; });
      var startedAt = entries[0].t;
      var block = el('div', {class:'history-session'}, '');
      block.appendChild(el('div', {class:'history-session-head'},
        formatDateTime(startedAt) + (sid === session.id ? ' (current)' : '') +
        ' <span class="n">&middot; ' + entries.length + ' answer' + (entries.length===1?'':'s') + '</span>'));
      var table = el('table', {class:'history-table'}, '');
      table.innerHTML = '<tr><th>Time</th><th>Group</th><th>Answer</th><th></th></tr>';
      entries.forEach(function(e){
        var tr = el('tr', {}, '');
        tr.appendChild(el('td', {}, formatDateTime(e.t).split(', ')[1]));
        tr.appendChild(el('td', {class: e.g === 'a' ? 'g-a' : 'g-b'}, e.g === 'a' ? 'High' : 'Low'));
        tr.appendChild(el('td', {}, e.v + FACT.suffix));
        var rmTd = el('td', {class:'rm'}, '');
        var rmBtn = el('button', {type:'button', 'aria-label':'Delete entry'}, '&times;');
        rmBtn.addEventListener('click', function(){ removeEntry(e.id); renderReveal(); });
        rmTd.appendChild(rmBtn);
        tr.appendChild(rmTd);
        table.appendChild(tr);
      });
      block.appendChild(table);
      historySection.appendChild(block);
    });
  }
  wrap.appendChild(historySection);

  var resetRow = el('div', {class:'reset-row'}, '');
  var clearAllBtn = el('button', {class:'session-btn danger', type:'button'}, 'Clear all history');
  clearAllBtn.addEventListener('click', function(){
    if (!confirm('Permanently delete all ' + log.length + ' recorded answer(s) across every session on this device? This can’t be undone.')) return;
    writeLog([]);
    startNewSession();
    renderReveal();
  });
  resetRow.appendChild(clearAllBtn);
  wrap.appendChild(resetRow);

  render(wrap);
}

function boot(){
  if (isReveal()) { renderReveal(); return; }
  var group = getGroupFromHash();
  if (!group || !GROUPS[group]) { renderNoGroup(); return; }
  renderComparative(group);
}

boot();
window.addEventListener('hashchange', boot);
/* if the room's browser (or the presenter pressing Esc) drops fullscreen on
   its own, drop presentation mode with it rather than leaving the page in a
   mixed state, small chrome hidden but no longer actually full-screen. */
document.addEventListener('fullscreenchange', function(){
  if (!document.fullscreenElement) {
    document.body.classList.remove('presenting');
    currentSyncModeSwitch();
  }
});
})();
</script>
