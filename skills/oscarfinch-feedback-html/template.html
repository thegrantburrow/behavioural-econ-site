<title>{{ARTIFACT TITLE}}</title>
<style>
:root{
  --paper:#F5F6F5; --paper-alt:#EBECEC; --panel:#FFFFFF; --line:rgba(27,30,36,0.12);
  --ink:#1B1E24; --ink-soft:rgba(27,30,36,0.6);
  --accent:#C43E1F; --accent-ink:#F5F6F5;
  --accent2:#1F7A6C; --accent2-ink:#F5F6F5;
  --good:#1F7A6C; --good-ink:#F5F6F5;
  --needs:#C43E1F; --needs-ink:#F5F6F5;
  --shadow: 0 1px 2px rgba(27,30,36,.06), 0 8px 24px rgba(27,30,36,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17191A; --paper-alt:#1D2023; --panel:#232628; --line:rgba(238,234,226,0.15);
    --ink:#EEEAE2; --ink-soft:rgba(238,234,226,0.6);
    --accent:#D97A56; --accent-ink:#1A1310;
    --accent2:#5FA89A; --accent2-ink:#0D1917;
    --good:#5FA89A; --good-ink:#0D1917;
    --needs:#D97A56; --needs-ink:#1A1310;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#17191A; --paper-alt:#1D2023; --panel:#232628; --line:rgba(238,234,226,0.15);
  --ink:#EEEAE2; --ink-soft:rgba(238,234,226,0.6);
  --accent:#D97A56; --accent-ink:#1A1310;
  --accent2:#5FA89A; --accent2-ink:#0D1917;
  --good:#5FA89A; --good-ink:#0D1917;
  --needs:#D97A56; --needs-ink:#1A1310;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --paper:#F5F6F5; --paper-alt:#EBECEC; --panel:#FFFFFF; --line:rgba(27,30,36,0.12);
  --ink:#1B1E24; --ink-soft:rgba(27,30,36,0.6);
  --accent:#C43E1F; --accent-ink:#F5F6F5;
  --accent2:#1F7A6C; --accent2-ink:#F5F6F5;
  --good:#1F7A6C; --good-ink:#F5F6F5;
  --needs:#C43E1F; --needs-ink:#F5F6F5;
  --shadow: 0 1px 2px rgba(27,30,36,.06), 0 8px 24px rgba(27,30,36,.08);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.wrap{max-width:860px;margin:0 auto;padding:44px 20px 80px;}
h1{font-family:Georgia,ui-serif,serif;font-size:30px;margin:0 0 6px;text-wrap:balance;}
.sub{color:var(--ink-soft);font-size:15px;line-height:1.6;margin:0 0 8px;max-width:60ch;}
.ask{font-size:13.5px;color:var(--ink-soft);background:var(--paper-alt);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:18px 0 36px;line-height:1.55;}
.ask b{color:var(--ink);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:28px;overflow:hidden;}
.card__head{padding:18px 22px 0;}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px;}
.card h3{font-family:Georgia,ui-serif,serif;font-size:19px;margin:0 0 6px;}
.card p.desc{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0 0 16px;max-width:62ch;}

/* Optional preview/mockup area — omit .preview entirely for text-only items (decisions, copy options) */
.preview{background:var(--paper-alt);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 22px;}

/* Binary toggle — exactly two states, no third "maybe" option */
.toggle{display:flex;gap:8px;padding:16px 22px 4px;flex-wrap:wrap;}
.toggle-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s;}
.toggle-btn:hover{border-color:var(--accent);}
.toggle-btn[data-active="true"][data-val="good"]{background:var(--good);border-color:var(--good);color:var(--good-ink);}
.toggle-btn[data-active="true"][data-val="needs-work"]{background:var(--needs);border-color:var(--needs);color:var(--needs-ink);}

.comment{margin:10px 22px 20px;}
.comment textarea{width:100%;min-height:44px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:13.5px;padding:9px 11px;}
.comment textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}

/* Not position:sticky (carried over from the original skill's 2026-08-18 fix): sticky+bottom
   on a short page (few cards) engages immediately and overlaps the last card instead of
   sitting below it. Plain document-flow block avoids this in every case. */
.feedback{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-top:36px;}
.feedback h3{font-family:Georgia,ui-serif,serif;font-size:17px;margin:0 0 10px;}
.feedback textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--paper-alt);color:var(--ink);font-family:inherit;font-size:13px;padding:10px;resize:vertical;}
.feedback-row{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;}
.copy-btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;}
.copy-btn[data-copied="true"]{background:var(--accent2);color:var(--accent2-ink);}

/* In-page theme toggle — non-negotiable, see SKILL.md */
.theme-toggle{position:fixed;top:14px;right:14px;z-index:20;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0;}
</style>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark theme">🌙</button>

<div class="wrap">
  <h1>{{PAGE TITLE}}</h1>
  <p class="sub">{{ONE-LINE SUBTITLE — what this set of options is for}}</p>
  <div class="ask">{{OPTIONAL: short instruction/context line}}</div>

  <!-- Repeat one .card per option/decision. data-title is what appears in the copied feedback. -->
  <div class="card" data-item data-title="{{Item 1 title}}">
    <div class="card__head">
      <span class="tag">{{optional category tag}}</span>
      <h3>{{Item 1 heading}}</h3>
      <p class="desc">{{Item 1 explanation / rationale}}</p>
    </div>
    <!-- Optional: a .preview block showing a live mockup/example. Omit for pure text decisions. -->
    <div class="preview">{{mockup / preview markup}}</div>
    <div class="toggle">
      <button class="toggle-btn" data-val="good">Looks good</button>
      <button class="toggle-btn" data-val="needs-work">Needs work</button>
    </div>
    <div class="comment"><textarea data-comment placeholder="Notes…"></textarea></div>
  </div>

  <!-- ...repeat .card blocks for each option... -->

  <div class="feedback">
    <h3>Feedback</h3>
    <textarea id="fb-output" readonly placeholder="Toggle options above. Your picks and notes will build up here."></textarea>
    <div class="feedback-row">
      <button class="copy-btn" id="fb-copy">Copy feedback</button>
    </div>
  </div>
</div>

<script>
(function(){
  var root = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  var KEY = 'of-fb-theme';
  var stored = null;
  try { stored = localStorage.getItem(KEY); } catch(e){}
  if (stored === 'light' || stored === 'dark') root.setAttribute('data-theme', stored);
  function sync(){
    var cur = root.getAttribute('data-theme');
    var isDark = cur === 'dark' || (cur !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    btn.textContent = isDark ? '☀️' : '🌙';
  }
  sync();
  btn.addEventListener('click', function(){
    var cur = root.getAttribute('data-theme');
    var curDark = cur === 'dark' || (cur !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = curDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(KEY, next); } catch(e){}
    sync();
  });
})();

document.querySelectorAll('[data-item]').forEach(function(item){
  item.querySelectorAll('.toggle-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var already = btn.getAttribute('data-active') === 'true';
      item.querySelectorAll('.toggle-btn').forEach(function(b){ b.removeAttribute('data-active'); });
      if(!already) btn.setAttribute('data-active','true');
      updateFeedback();
    });
  });
  var ta = item.querySelector('[data-comment]');
  if(ta) ta.addEventListener('input', updateFeedback);
});

function updateFeedback(){
  var out = [];
  document.querySelectorAll('[data-item]').forEach(function(item){
    var active = item.querySelector('.toggle-btn[data-active="true"]');
    var comment = item.querySelector('[data-comment]');
    var commentVal = comment ? comment.value.trim() : '';
    if(!active && !commentVal) return;
    var title = item.getAttribute('data-title');
    var choice = active ? active.textContent.trim() : '(no choice)';
    out.push('— ' + title + '\n  Choice: ' + choice + (commentVal ? '\n  Comment: ' + commentVal : ''));
  });
  document.getElementById('fb-output').value = out.length ? out.join('\n\n') : '';
}

document.getElementById('fb-copy').addEventListener('click', function(){
  var btn = this;
  var text = document.getElementById('fb-output').value;
  if(!text){ return; }
  function done(){
    btn.textContent = 'Copied ✓';
    btn.setAttribute('data-copied','true');
    setTimeout(function(){ btn.textContent = 'Copy feedback'; btn.removeAttribute('data-copied'); }, 1800);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
});
function fallbackCopy(text, cb){
  var ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  cb();
}
</script>
